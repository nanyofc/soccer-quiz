<script>


/* =========================
   LIFF
========================= */


const LIFF_ID =
"2011248919-qSr0JfnE";


let liffReady =
false;


async function initializeLiff(){

  try{

    await liff.init({

      liffId:
      LIFF_ID

    });

    liffReady =
    true;

  }catch(error){

    console.error(
      error
    );

  }

}


initializeLiff();



/* =========================
   QRコード読み取り
========================= */


async function scanQR(){

  try{

    if(
      !liffReady
    ){

      await liff.init({

        liffId:
        LIFF_ID

      });

      liffReady =
      true;

    }


    if(
      !liff.isInClient()
    ){

      alert(
        "QRコードの読み取りはLINEアプリ内からご利用ください。"
      );

      return;

    }


    const result =
      await liff.scanCodeV2();


    if(
      !result ||
      !result.value
    ){

      return;

    }


    const scanned =
      result.value.trim();


    let url;


    try{

      url =
        new URL(
          scanned
        );

    }catch(e){

      alert(
        "このQRコードはクイズラリー用ではありません。"
      );

      return;

    }


    if(

      url.hostname !==
      "nanyofc.github.io"

      ||

      !url.pathname.startsWith(
        "/soccer-quiz"
      )

    ){

      alert(
        "このQRコードはクイズラリー用ではありません。"
      );

      return;

    }


    const number =
      parseInt(

        url.searchParams.get(
          "q"
        ),

        10

      );


    if(

      !Number.isInteger(
        number
      )

      ||

      number < 1

      ||

      number > 5

    ){

      alert(
        "問題番号を確認できませんでした。"
      );

      return;

    }


    window.location.href =

      window.location.pathname

      +

      "?q="

      +

      number;


  }catch(error){

    console.error(
      error
    );

  }

}



/* =========================
   問題データ
========================= */


const questions = [


{

question:

`守備側Aが、意図的に足で味方のゴールキーパーへボールを蹴った。
ゴールキーパーは自陣ペナルティーエリア内で、そのボールを手でキャッチした。
正しい判定は？`,


choices:[

"A. そのままプレーを続ける",

"B. 相手チームのペナルティーキック",

"C. 相手チームの間接フリーキック",

"D. 相手チームのコーナーキック"

],


correct:2,


answer:

"正解：C　相手チームの間接フリーキック",


explanation:

`味方競技者が意図的に足でゴールキーパーへ蹴ったボールを、ゴールキーパーが自陣ペナルティーエリア内で手や腕で扱うと反則になります。

相手チームに間接フリーキックが与えられます。

味方が頭や胸、膝などで通常のプレーとしてGKへ返したボールは、原則として手で扱えます。`

},


{

question:

`ゴールキーパーが自陣ペナルティーエリア内で、手や腕でボールを8秒を超えてコントロールした場合、正しい判定は？`,


choices:[

"A. 相手チームの間接フリーキック",

"B. 相手チームのコーナーキック",

"C. 相手チームのペナルティキック",

"D. ドロップボール"

],


correct:1,


answer:

"正解：B　相手チームのコーナーキック",


explanation:

`ゴールキーパーが手や腕でボールを8秒を超えてコントロールした場合、相手チームにコーナーキックが与えられます。

主審は最後の5秒を手でカウントダウンして、ゴールキーパーに残り時間を知らせます。`

},


{

question:

`次のうち、オフサイドポジションにいる攻撃側競技者が味方から直接ボールを受けた場合、オフサイドの反則になる可能性があるものはどれ？`,


choices:[

"A. ゴールキック",

"B. コーナーキック",

"C. スローイン",

"D. 間接フリーキック"

],


correct:3,


answer:

"正解：D　間接フリーキック",


explanation:

`ゴールキック・コーナーキック・スローインから直接ボールを受けた場合は、オフサイドになりません。

一方、間接フリーキックにはオフサイドの適用があります。

キックされた瞬間にオフサイドポジションにいた選手が、その後ボールをプレーするなどして反則の条件を満たせば、オフサイドとなります。`

},


{

question:

`攻撃側Aが前方へパスを出した瞬間、攻撃側Bはオフサイドポジションにいた。

守備側Cは、そのパスが自分の方向へ来るのを確認し、時間と距離に余裕がある状態で、自らボールを蹴ってクリアしようとした。

しかしキックをミスし、ボールは攻撃側Bのところへ渡った。

攻撃側Bはそのままシュートして得点した。

正しい判定は？`,


choices:[

"A. オフサイド判定、守備側の間接フリーキック",

"B. ゴールを認める",

"C. ドロップボールで再開",

"D. オフサイド判定、守備側の直接フリーキック"

],


correct:1,


answer:

"正解：B　ゴールを認める",


explanation:

`守備側Cにはボールをプレーする時間・視野・身体のコントロールがあり、意図的にボールをプレーしているため、結果的にミスキックになっても「意図的なプレー」と判断できます。

そのため、攻撃側Bがそのボールを受けてもオフサイドの反則にはなりません。`

},


{

question:

`守備側Aが自陣ペナルティーエリア内で、相手のクロスボールをクリアしようと足を出した。

ボールは守備側A自身の足に当たった直後、自然な位置にあった守備側Aの腕に触れた。

守備側Aは腕をボールの方向へ動かしておらず、腕によって身体を不自然に大きくしていなかった。

正しい判定は？`,


choices:[

"A. ハンドの反則、攻撃側のペナルティーキック",

"B. ハンドの反則、攻撃側の間接フリーキック",

"C. 反則ではない。プレーを続ける",

"D. ドロップボールで再開する"

],


correct:2,


answer:

"正解：C　反則ではない。プレーを続ける",


explanation:

`ボールが手や腕に触れたという事実だけで、すべてハンドの反則になるわけではありません。

このケースでは、腕が身体の動きとして自然な位置にあり、ボールに向かって意図的に腕を動かしたわけでも、腕によって身体を不自然に大きくしたわけでもないため、ハンドの反則とはならず、プレー続行となります。`

}


];



/* =========================
   保存キー
========================= */


const STORAGE_KEY =

"nanyo_soccer_quiz_official_final_20260825_2131";


const GACHA_KEY =

"nanyo_soccer_quiz_gacha_test_20260825";



let cleared =
[];


try{

  const saved =

    JSON.parse(

      localStorage.getItem(
        STORAGE_KEY
      )

      ||

      "[]"

    );


  if(
    Array.isArray(
      saved
    )
  ){

    cleared =

      saved.filter(

        function(number){

          return (

            Number.isInteger(
              number
            )

            &&

            number >= 1

            &&

            number <= 5

          );

        }

      );

  }

}catch(e){

  cleared =
  [];

}


cleared =
[...new Set(cleared)];

/* =========================
   隠しリセット
========================= */


let secretTapCount =
0;


let secretTimer =
null;


function secretLogoTap(){

  secretTapCount++;


  clearTimeout(
    secretTimer
  );


  secretTimer =

    setTimeout(
      function(){

        secretTapCount =
        0;

      },

      2500
    );


  if(
    secretTapCount >= 7
  ){

    secretTapCount =
    0;


    const result =

      confirm(

        "【テスト用】\nガチャ履歴をリセットしますか？"

      );


    if(
      result
    ){

      localStorage.removeItem(
        GACHA_KEY
      );


      alert(
        "ガチャ履歴をリセットしました。"
      );


      location.reload();

    }

  }

}

/* =========================
   紙吹雪
========================= */


function confetti(

  amount = 55

){

  const colors = [

    "#c60012",

    "#ffd84d",

    "#16834a",

    "#4b89ff",

    "#ff75b5",

    "#9c5cff"

  ];


  for(
    let i=0;
    i<amount;
    i++
  ){

    const item =

      document.createElement(
        "div"
      );


    item.className =
      "confetti";


    item.style.left =

      Math.random()
      *100
      +"vw";


    item.style.background =

      colors[
        Math.floor(
          Math.random()
          *colors.length
        )
      ];


    item.style.animationDuration =

      (
        2.3
        +
        Math.random()*2
      )
      +"s";


    item.style.transform =

      "rotate("

      +

      Math.random()*360

      +

      "deg)";


    document.body.appendChild(
      item
    );


    setTimeout(
      function(){

        item.remove();

      },

      5000
    );

  }

}

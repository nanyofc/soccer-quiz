<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>南陽FC サッカールール クイズラリー</title>

<!-- LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
:root{
  --red:#c60012;
  --green:#16834a;
  --bg:#f7f7f7;
  --card:#ffffff;
  --text:#222;
  --gray:#777;
  --gold:#e6ac00;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:
    "Hiragino Maru Gothic ProN",
    "Hiragino Maru Gothic Pro",
    "Yu Gothic",
    "Noto Sans JP",
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(255,210,215,.55),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 35%,
      rgba(220,245,230,.7),
      transparent 30%
    ),
    var(--bg);

  color:var(--text);
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#b90011,#df0018);
  color:#fff;
  text-align:center;
  padding:20px 12px;
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
  box-shadow:0 4px 15px rgba(198,0,18,.22);
}

.wrap{
  width:100%;
  max-width:650px;
  margin:0 auto;
  padding:22px;
}

.card{
  background:rgba(255,255,255,.96);
  border-radius:28px;
  padding:28px;
  box-shadow:
    0 12px 35px rgba(0,0,0,.09);
  animation:cardIn .45s ease;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.logo{
  display:block;
  width:78%;
  max-width:300px;
  height:auto;
  margin:0 auto 25px;
  object-fit:contain;
  user-select:none;
}

h1{
  margin:0 0 20px;
  font-size:30px;
  font-weight:900;
}

p{
  line-height:1.8;
}

.question{
  white-space:pre-line;
  font-size:19px;
  font-weight:800;
  line-height:1.75;
  margin:22px 0;
}

.point{
  display:inline-block;
  background:#f1f1f1;
  color:#555;
  font-weight:900;
  padding:7px 13px;
  border-radius:30px;
  margin-bottom:10px;
}

.choice{
  width:100%;
  display:block;
  background:#fff;
  border:2px solid #d8dfdc;
  border-radius:18px;
  padding:17px;
  margin:11px 0;
  text-align:left;
  font-size:16px;
  font-family:inherit;
  font-weight:700;
  line-height:1.5;
  transition:
    transform .12s ease,
    border-color .15s ease,
    box-shadow .15s ease;
}

.choice:active{
  transform:scale(.97);
}

.choice:disabled{
  opacity:.6;
}

.correct{
  color:var(--green);
  font-size:19px;
  font-weight:900;
  line-height:1.6;
  animation:pop .4s ease;
}

.wrong{
  color:#c43d3d;
  font-weight:900;
  animation:shake .3s ease;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

@keyframes pop{
  0%{transform:scale(.85);opacity:0}
  70%{transform:scale(1.08)}
  100%{transform:scale(1);opacity:1}
}

.explanation{
  background:#f2f7f3;
  border-left:5px solid var(--green);
  padding:18px;
  border-radius:12px;
  white-space:pre-line;
  line-height:1.8;
  margin-top:15px;
}

.home-button,
.scan-button,
.gacha-button{
  width:100%;
  border:none;
  color:#fff;
  border-radius:18px;
  font-family:inherit;
  font-weight:900;
  cursor:pointer;
  transition:transform .12s ease;
}

.home-button:active,
.scan-button:active,
.gacha-button:active{
  transform:scale(.97);
}

.home-button{
  margin-top:22px;
  padding:16px;
  background:#222;
  font-size:16px;
}

.scan-button{
  margin-top:22px;
  padding:18px;
  background:linear-gradient(135deg,#16834a,#20a960);
  font-size:18px;
  box-shadow:0 7px 20px rgba(22,131,74,.25);
}

.stamp-title{
  margin-top:30px;
  text-align:center;
  font-weight:900;
  font-size:19px;
}

.balls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin:17px 0 10px;
}

.ball{
  font-size:39px;
  line-height:1;
  filter:grayscale(100%);
  opacity:.14;
}

.ball.done{
  filter:none;
  opacity:1;
  animation:stampPop .45s ease;
}

@keyframes stampPop{
  0%{
    transform:scale(2) rotate(-20deg);
    opacity:0;
  }
  70%{
    transform:scale(.9) rotate(5deg);
  }
  100%{
    transform:scale(1);
  }
}

.count{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin-top:10px;
}

.remaining{
  text-align:center;
  font-size:18px;
  margin-top:18px;
  font-weight:700;
}

.note{
  color:#777;
  font-size:14px;
  margin-top:28px;
  line-height:1.8;
}

.complete{
  text-align:center;
  color:var(--green);
  font-size:24px;
  font-weight:900;
  margin:25px 0 15px;
  animation:pop .55s ease;
}


/* =====================
   ガチャ
===================== */

.gacha-area{
  margin-top:30px;
  padding:24px 18px;
  text-align:center;
  border-radius:24px;
  background:
    linear-gradient(
      135deg,
      #fff7d6,
      #fff,
      #fff2bd
    );
  border:2px solid #f2d46d;
}

.gacha-title{
  font-size:27px;
  font-weight:900;
  margin-bottom:8px;
}

.gacha-sub{
  font-size:15px;
  color:#666;
  line-height:1.7;
}

.gacha-machine{
  font-size:90px;
  margin:20px 0;
  line-height:1;
}

.gacha-machine.spinning{
  animation:gachaShake .12s linear infinite;
}

@keyframes gachaShake{
  0%{transform:translate(-3px,-1px) rotate(-3deg)}
  25%{transform:translate(3px,2px) rotate(3deg)}
  50%{transform:translate(-2px,3px) rotate(-2deg)}
  75%{transform:translate(3px,-2px) rotate(2deg)}
  100%{transform:translate(0,0)}
}

.gacha-button{
  padding:19px;
  font-size:20px;
  background:
    linear-gradient(
      135deg,
      #f0a500,
      #ffca28
    );
  color:#3b2a00;
  box-shadow:0 8px 20px rgba(230,172,0,.28);
}

.gacha-button:disabled{
  background:#bbb;
  color:#fff;
  box-shadow:none;
}

.gacha-result{
  margin-top:22px;
  min-height:30px;
}

.prize{
  border-radius:20px;
  padding:24px 15px;
  background:#fff;
  box-shadow:0 7px 25px rgba(0,0,0,.12);
  animation:prizeIn .65s cubic-bezier(.2,.8,.2,1);
}

@keyframes prizeIn{
  0%{
    transform:scale(.3) rotate(-15deg);
    opacity:0;
  }
  60%{
    transform:scale(1.15) rotate(3deg);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

.prize-rank{
  font-size:17px;
  font-weight:900;
  color:#a47800;
}

.prize-name{
  margin-top:8px;
  font-size:29px;
  font-weight:900;
}

.used-message{
  font-weight:900;
  color:#777;
  margin-top:15px;
}


/* 紙吹雪 */

.confetti{
  position:fixed;
  top:-20px;
  width:10px;
  height:16px;
  z-index:9999;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:
      translateY(110vh)
      rotate(720deg);
  }
}


@media(max-width:430px){

  .wrap{
    padding:18px;
  }

  .card{
    padding:24px;
  }

  .logo{
    width:80%;
  }

  .ball{
    font-size:35px;
  }

  h1{
    font-size:28px;
  }

  .gacha-machine{
    font-size:78px;
  }
}

</style>
</head>

<header>
南陽FC サッカールール クイズラリー
</header>

<div class="wrap">
  <div class="card" id="app"></div>
</div>


<script>

/* =========================
   設定
========================= */

const LIFF_ID =
  "2011248919-qSr0JfnE";

const STORAGE_KEY =
  "nanyo_soccer_quiz_official_final_20260825_2131";

const GACHA_KEY =
  "nanyo_soccer_quiz_gacha_used_v1";

/*
  試作用ガチャ総数
*/
const TOTAL_GACHA = 1000;


/* =========================
   LIFF
========================= */

let liffReady = false;

async function initializeLiff(){

  try{

    await liff.init({
      liffId:LIFF_ID
    });

    liffReady = true;

  }catch(error){

    console.error(
      "LIFF initialization failed",
      error
    );

  }

}

initializeLiff();


/* =========================
   QRコード
========================= */

async function scanQR(){

  try{

    if(!liffReady){

      await liff.init({
        liffId:LIFF_ID
      });

      liffReady = true;

    }

    if(!liff.isInClient()){

      alert(
        "QRコードの読み取りはLINEアプリ内からご利用ください。"
      );

      return;

    }

    const result =
      await liff.scanCodeV2();

    if(
      !result ||
      !result.value
    ){
      return;
    }

    const scanned =
      result.value.trim();

    let url;

    try{

      url =
        new URL(scanned);

    }catch(e){

      alert(
        "このQRコードはクイズラリー用ではありません。"
      );

      return;

    }

    if(
      url.hostname !== "nanyofc.github.io" ||
      !url.pathname.startsWith("/soccer-quiz")
    ){

      alert(
        "このQRコードはクイズラリー用ではありません。"
      );

      return;

    }

    const number =
      parseInt(
        url.searchParams.get("q"),
        10
      );

    if(
      !Number.isInteger(number) ||
      number < 1 ||
      number > 5
    ){

      alert(
        "問題番号を確認できませんでした。"
      );

      return;

    }

    window.location.href =
      window.location.pathname +
      "?q=" +
      number;

  }catch(error){

    console.error(
      "QR scan error",
      error
    );

  }

}


/* =========================
   問題
========================= */

const questions = [

{
question:
`守備側Aが、意図的に足で味方のゴールキーパーへボールを蹴った。
ゴールキーパーは自陣ペナルティーエリア内で、そのボールを手でキャッチした。
正しい判定は？`,

choices:[
"A. そのままプレーを続ける",
"B. 相手チームのペナルティーキック",
"C. 相手チームの間接フリーキック",
"D. 相手チームのコーナーキック"
],

correct:2,

answer:
"正解：C　相手チームの間接フリーキック",

explanation:
`味方競技者が意図的に足でゴールキーパーへ蹴ったボールを、ゴールキーパーが自陣ペナルティーエリア内で手や腕で扱うと反則になります。

相手チームに間接フリーキックが与えられます。

味方が頭や胸、膝などで通常のプレーとしてGKへ返したボールは、原則として手で扱えます。`
},

{
question:
`ゴールキーパーが自陣ペナルティーエリア内で、手や腕でボールを8秒を超えてコントロールした場合、正しい判定は？`,

choices:[
"A. 相手チームの間接フリーキック",
"B. 相手チームのコーナーキック",
"C. 相手チームのペナルティキック",
"D. ドロップボール"
],

correct:1,

answer:
"正解：B　相手チームのコーナーキック",

explanation:
`ゴールキーパーが手や腕でボールを8秒を超えてコントロールした場合、相手チームにコーナーキックが与えられます。

主審は最後の5秒を手でカウントダウンして、ゴールキーパーに残り時間を知らせます。`
},

{
question:
`次のうち、オフサイドポジションにいる攻撃側競技者が味方から直接ボールを受けた場合、オフサイドの反則になる可能性があるものはどれ？`,

choices:[
"A. ゴールキック",
"B. コーナーキック",
"C. スローイン",
"D. 間接フリーキック"
],

correct:3,

answer:
"正解：D　間接フリーキック",

explanation:
`ゴールキック・コーナーキック・スローインから直接ボールを受けた場合は、オフサイドになりません。

一方、間接フリーキックにはオフサイドの適用があります。

キックされた瞬間にオフサイドポジションにいた選手が、その後ボールをプレーするなどして反則の条件を満たせば、オフサイドとなります。`
},

{
question:
`攻撃側Aが前方へパスを出した瞬間、攻撃側Bはオフサイドポジションにいた。

守備側Cは、そのパスが自分の方向へ来るのを確認し、時間と距離に余裕がある状態で、自らボールを蹴ってクリアしようとした。

しかしキックをミスし、ボールは攻撃側Bのところへ渡った。

攻撃側Bはそのままシュートして得点した。

正しい判定は？`,

choices:[
"A. オフサイド判定、守備側の間接フリーキック",
"B. ゴールを認める",
"C. ドロップボールで再開",
"D. オフサイド判定、守備側の直接フリーキック"
],

correct:1,

answer:
"正解：B　ゴールを認める",

explanation:
`守備側Cにはボールをプレーする時間・視野・身体のコントロールがあり、意図的にボールをプレーしているため、結果的にミスキックになっても「意図的なプレー」と判断できます。

そのため、攻撃側Bがそのボールを受けてもオフサイドの反則にはなりません。`
},

{
question:
`守備側Aが自陣ペナルティーエリア内で、相手のクロスボールをクリアしようと足を出した。

ボールは守備側A自身の足に当たった直後、自然な位置にあった守備側Aの腕に触れた。

守備側Aは腕をボールの方向へ動かしておらず、腕によって身体を不自然に大きくしていなかった。

正しい判定は？`,

choices:[
"A. ハンドの反則、攻撃側のペナルティーキック",
"B. ハンドの反則、攻撃側の間接フリーキック",
"C. 反則ではない。プレーを続ける",
"D. ドロップボールで再開する"
],

correct:2,

answer:
"正解：C　反則ではない。プレーを続ける",

explanation:
`ボールが手や腕に触れたという事実だけで、すべてハンドの反則になるわけではありません。

このケースでは、腕が身体の動きとして自然な位置にあり、ボールに向かって意図的に腕を動かしたわけでも、腕によって身体を不自然に大きくしたわけでもないため、ハンドの反則とはならず、プレー続行となります。`
}

];


/* =========================
   スタンプ
========================= */

let cleared = [];

try{

  const saved =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY)
      || "[]"
    );

  if(Array.isArray(saved)){

    cleared =
      saved.filter(function(number){

        return (
          Number.isInteger(number) &&
          number >= 1 &&
          number <= 5
        );

      });

  }

}catch(e){

  cleared = [];

}

cleared =
  [...new Set(cleared)];


function saveCleared(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(cleared)
  );

}


/* =========================
   共通
========================= */

const app =
  document.getElementById("app");

const params =
  new URLSearchParams(
    window.location.search
  );

const questionNumber =
  parseInt(
    params.get("q") || "0",
    10
  );


function logoHTML(){

  return `
  <img
    src="./nanyo.png"
    class="logo"
    id="secretLogo"
    alt="南陽FC"
  >
  `;

}


function stampHTML(){

  let html =
    '<div class="balls">';

  for(let i=1;i<=5;i++){

    if(cleared.includes(i)){

      html +=
        '<span class="ball done">⚽</span>';

    }else{

      html +=
        '<span class="ball">⚽</span>';

    }

  }

  html += '</div>';

  return html;

}


function backHome(){

  window.location.href =
    window.location.pathname;

}


/* =========================
   隠しリセット
========================= */

let secretTapCount = 0;
let secretTimer = null;


function setupSecretReset(){

  const logo =
    document.getElementById(
      "secretLogo"
    );

  if(!logo){
    return;
  }

  logo.addEventListener(
    "click",
    function(){

      secretTapCount++;

      clearTimeout(secretTimer);

      secretTimer =
        setTimeout(function(){

          secretTapCount = 0;

        },3000);


      if(secretTapCount >= 7){

        secretTapCount = 0;

        const ok =
          confirm(
            "【管理用】\nガチャ履歴をリセットしますか？"
          );

        if(ok){

          localStorage.removeItem(
            GACHA_KEY
          );

          alert(
            "ガチャ履歴をリセットしました。"
          );

          showTop();

        }

      }

    }
  );

}


/* =========================
   ガチャ設定
========================= */

/*
  合計1000個

  特賞  5
  1等  20
  2等  75
  3等  200
  参加賞 700
*/

const GACHA_PRIZES = [

{
rank:"特賞",
name:"スペシャル賞",
count:5
},

{
rank:"1等",
name:"1等賞",
count:20
},

{
rank:"2等",
name:"2等賞",
count:75
},

{
rank:"3等",
name:"3等賞",
count:200
},

{
rank:"参加賞",
name:"参加賞",
count:700
}

];


function hasUsedGacha(){

  return (
    localStorage.getItem(
      GACHA_KEY
    ) === "1"
  );

}


/*
  1000個の中から抽選
*/

function drawPrize(){

  const random =
    Math.floor(
      Math.random() *
      TOTAL_GACHA
    ) + 1;

  let cumulative = 0;

  for(
    const prize of GACHA_PRIZES
  ){

    cumulative +=
      prize.count;

    if(random <= cumulative){

      return prize;

    }

  }

  return GACHA_PRIZES[
    GACHA_PRIZES.length - 1
  ];

}


/* =========================
   紙吹雪
========================= */

function createConfetti(){

  const symbols = [
    "🎉",
    "⭐",
    "⚽",
    "✨",
    "🎊"
  ];

  for(let i=0;i<35;i++){

    const piece =
      document.createElement(
        "div"
      );

    piece.className =
      "confetti";

    piece.textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];

    piece.style.left =
      Math.random() *
      100 +
      "vw";

    piece.style.fontSize =
      (
        12 +
        Math.random() * 18
      ) +
      "px";

    piece.style.animationDuration =
      (
        1.8 +
        Math.random() * 2
      ) +
      "s";

    piece.style.animationDelay =
      (
        Math.random() * .5
      ) +
      "s";

    document.body.appendChild(
      piece
    );

    setTimeout(
      function(){
        piece.remove();
      },
      4500
    );

  }

}


/* =========================
   ガチャ実行
========================= */

function playGacha(){

  if(hasUsedGacha()){

    alert(
      "ガチャは1回までです。"
    );

    return;

  }

  const machine =
    document.getElementById(
      "gachaMachine"
    );

  const button =
    document.getElementById(
      "gachaButton"
    );

  const result =
    document.getElementById(
      "gachaResult"
    );


  if(!machine || !button || !result){
    return;
  }


  button.disabled = true;

  machine.classList.add(
    "spinning"
  );

  result.innerHTML =
    `
    <p>
    ガチャガチャ抽選中…！
    </p>
    `;


  setTimeout(function(){

    machine.classList.remove(
      "spinning"
    );

    const prize =
      drawPrize();

    /*
      抽選済みとして保存
    */

    localStorage.setItem(
      GACHA_KEY,
      "1"
    );


    result.innerHTML =
      `
      <div class="prize">

        <div class="prize-rank">
        ${prize.rank}
        </div>

        <div class="prize-name">
        ${prize.name}
        </div>

        <p>
        おめでとうございます！
        </p>

      </div>
      `;


    createConfetti();


    button.textContent =
      "抽選済み";

  },1800);

}


/* =========================
   ガチャ表示
========================= */

function gachaHTML(){

  if(cleared.length !== 5){

    return "";

  }


  if(hasUsedGacha()){

      🎰
      </div>

      <div class="used-message">
      ガチャは抽選済みです。
      </div>

    </div>
    `;

  }


  return `
  <div class="gacha-area">

    <div class="gacha-title">
    🎉 全問クリアガチャ
    </div>

    <div class="gacha-sub">
    全問正解おめでとう！<br>

    <div
      class="gacha-machine"
      id="gachaMachine"
    >

    </div>

      id="gachaResult"
    ></div>

  </div>
  `;

function showQuestion(number){

  const q =
    questions[number-1];


  app.innerHTML =

    logoHTML() +

    `
    <div class="point">
    POINT ${number} / 5
    </div>

    ${stampHTML()}

    <div class="question">
    ${q.question}
    </div>

    <div id="choices"></div>

    <div id="message"></div>

    <button
      class="home-button"
      onclick="backHome()"
    >
    ← トップページに戻る
    </button>
    `;


  const choices =
    document.getElementById(
      "choices"
    );


  q.choices.forEach(
    function(text,index){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "choice";

      button.textContent =
        text;


      button.onclick =
        function(){

          const message =
            document.getElementById(
              "message"
            );


          if(index !== q.correct){

            message.innerHTML =
              `
              <p class="wrong">
              ❌ 不正解！
              もう一度挑戦してください。
              </p>
              `;

            return;

          }


          if(
            !cleared.includes(number)
          ){

            cleared.push(number);

            cleared.sort(
              function(a,b){
                return a-b;
              }
            );

            saveCleared();

          }


          const buttons =
            choices.querySelectorAll(
              "button"
            );

          buttons.forEach(
            function(btn){
              btn.disabled = true;
            }
          );


          let finish = "";


          if(cleared.length === 5){

            finish =
              `
              <div class="complete">
              🎉 全問クリア！
              <br>
              トップページでガチャに挑戦しよう！
              </div>
              `;

            createConfetti();

          }


          message.innerHTML =
            `
            <p class="correct">
            ⭕ 正解！
            <br>
            サッカーボールスタンプ獲得 ⚽
            </p>

            ${stampHTML()}

            <div class="explanation">

            <strong>
            ${q.answer}
            </strong>
